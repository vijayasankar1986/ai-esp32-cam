# Three joints position the tool, so a full six-DOF pose goal is unsolvable by
# construction. position_only_ik makes KDL solve for the point and ignore the
# orientation, which is what this arm can actually deliver.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  position_only_ik: true
