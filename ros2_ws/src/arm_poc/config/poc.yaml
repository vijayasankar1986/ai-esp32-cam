arm_poc:
  ros__parameters:
    # Verified from the camera firmware's own embedded page (2026-09-22):
    #   MJPEG stream  http://<camera-ip>:81/stream   <- use this
    #   single still  http://<camera-ip>/capture
    # In factory AP mode <camera-ip> is 192.168.5.1. The firmware is AP-only,
    # so the Pi must share that network to reach it. See docs/PI_DEPLOYMENT.md.
    camera_url: "http://192.168.1.10/capture"
    # HARDWARE MODE, set at the operator's request. The node opens the serial
    # port and commands home on startup, so the arm moves as soon as it runs.
    # Set true to go back to observing only.
    dry_run: false
    serial_port: "/dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0"
    home_pose: [90, 90, 90, 90]
    trigger_pose: [90, 90, 90, 90] # Deliberately no motion until calibrated
    # Must match MIN_ANGLE/MAX_ANGLE in firmware/arm_controller, or the
    # controller answers ERR limits and the node faults.
    min_angles: [0, 0, 0, 0]
    max_angles: [180, 180, 180, 180]
    target_color: "red" # red, green, blue, yellow, orange or purple
    color_fraction: 0.05 # Fraction of the frame the largest matching blob must fill
    # Image-to-joint calibration: six numbers per point, u v then four angles.
    # u and v are the object centre in the frame, 0..1, left-to-right and
    # top-to-bottom. Put the object somewhere, read u and v from
    # /vision/target_point, jog the arm to reach it, record its angles, repeat.
    # Three non-collinear points minimum; four corners is better. Leave empty
    # to keep the original single fixed trigger_pose behaviour.
    calibration: []
    stable_frames: 3
    hold_seconds: 6.0 # Firmware steps one joint at a time on USB power, so a
                      # four-joint move takes about four times longer to finish
    camera_stale_seconds: 8.0 # Must exceed the camera's slowest frame interval
    connect_timeout: 5.0
    read_timeout: 10.0 # A VGA frame takes about a second to encode; leave room
    # On a stale feed the node always sends STOP. With auto_recover it then waits
    # for frames and resumes from home with a fresh detection gate, so a recovery
    # can never continue an interrupted motion. Set false to require a manual
    # restart instead, which you may prefer once real servos are attached.
    auto_recover: true
    # Manual jog from the dashboard, enabled at the operator's request.
    # Be clear what this means: the dashboard has no authentication and binds
    # every interface, so with ARM_DASHBOARD_CONTROL=1 set on it as well,
    # anyone who can reach port 8080 can move the arm. Set false to disarm the
    # node side; the dashboard's own flag is in dashboard/arm-dashboard.service.
    # dry_run below is the remaining gate: while it is true nothing reaches a
    # servo, whatever the jog panel says.
    allow_manual: true
    manual_timeout: 2.0 # A jog not refreshed within this window lapses and the
                        # arm returns home, so a closed tab cannot leave it held
