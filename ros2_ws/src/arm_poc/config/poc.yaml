arm_poc:
  ros__parameters:
    camera_url: "" # Required: actual HTTP JPEG/MJPEG endpoint
    dry_run: true
    serial_port: "/dev/serial/by-id/REPLACE_WITH_YOUR_CONTROLLER"
    home_pose: [90, 90, 90, 90]
    trigger_pose: [90, 90, 90, 90] # Deliberately no motion until calibrated
    min_angles: [80, 80, 80, 80]
    max_angles: [100, 100, 100, 100]
    red_fraction: 0.05
    stable_frames: 3
    hold_seconds: 3.0
    camera_stale_seconds: 3.0
